<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="520" rx="28" fill="#0F172A"/>
  <text x="600" y="58" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">The Trusted Advisor Flywheel</text>
  <text x="600" y="92" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Build trust before asking for commitment</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38BDF8" />
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="55" y="190" width="130" height="78" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="120" y="223" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">Conversation</text>
    <text x="120" y="249" fill="#CBD5E1" font-size="13" text-anchor="middle">Open the door</text>

    <line x1="190" y1="229" x2="255" y2="229" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="265" y="180" width="145" height="98" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="337.5" y="214" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">Diagnosis</text>
    <text x="337.5" y="240" fill="#CBD5E1" font-size="13" text-anchor="middle">Understand the</text>
    <text x="337.5" y="258" fill="#CBD5E1" font-size="13" text-anchor="middle">business problem</text>

    <line x1="415" y1="229" x2="480" y2="229" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="490" y="190" width="130" height="78" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="555" y="223" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">Insight</text>
    <text x="555" y="249" fill="#CBD5E1" font-size="13" text-anchor="middle">Create value</text>

    <line x1="625" y1="229" x2="690" y2="229" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="700" y="190" width="130" height="78" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="765" y="223" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">Trust</text>
    <text x="765" y="249" fill="#CBD5E1" font-size="13" text-anchor="middle">Earn belief</text>

    <line x1="835" y1="229" x2="900" y2="229" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="910" y="180" width="145" height="98" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="982.5" y="214" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">Access</text>
    <text x="982.5" y="240" fill="#CBD5E1" font-size="13" text-anchor="middle">Audit, review,</text>
    <text x="982.5" y="258" fill="#CBD5E1" font-size="13" text-anchor="middle">or strategy call</text>

    <path d="M982 285 C940 390, 760 440, 600 440 C430 440, 250 390, 120 285" stroke="#38BDF8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="435" y="352" width="330" height="78" rx="18" fill="#082F49" stroke="#7DD3FC" stroke-width="2"/>
    <text x="600" y="385" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">Credibility → Future Opportunity</text>
    <text x="600" y="411" fill="#BAE6FD" font-size="14" text-anchor="middle">The relationship is stronger even when the deal does not close today.</text>
  </g>
</svg>
